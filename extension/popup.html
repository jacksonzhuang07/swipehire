<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SwipeHire</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; width: 330px; margin: 0; padding: 14px; color: #111; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p.hint { color: #656e7b; font-size: 12px; margin: 4px 0 10px; }
  label { display: block; font-size: 12px; font-weight: 600; margin: 10px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #d4d9de; border-radius: 8px; }
  button { background: linear-gradient(45deg, #fd267a, #ff7854); color: #fff; border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 700; cursor: pointer; }
  button.secondary { background: #eef0f2; color: #111; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .job { border: 1px solid #e6e8eb; border-radius: 10px; padding: 9px 10px; margin-top: 8px; cursor: pointer; }
  .job:hover { border-color: #fd267a; }
  .job b { font-size: 13px; }
  .job span { display: block; color: #656e7b; font-size: 12px; }
  #status { font-size: 12px; color: #0a7d4f; min-height: 16px; margin-top: 8px; }
  #status.err { color: #c9184a; }
</style>
</head>
<body>
  <h1>💘 SwipeHire</h1>
  <p class="hint">Assisted apply for login-required jobs. Pair once with the token from SwipeHire → Connections.</p>
  <label>SwipeHire address (API base)</label>
  <input id="apiBase" placeholder="https://swipehire-jade.vercel.app">
  <label>Pairing token</label>
  <input id="token" type="password" placeholder="shx_…">
  <div class="row">
    <button id="save">Save pairing</button>
    <button id="load" class="secondary">Load my queue</button>
  </div>
  <div id="status"></div>
  <div id="queue"></div>
  <script src="popup.js"></script>
</body>
</html>
