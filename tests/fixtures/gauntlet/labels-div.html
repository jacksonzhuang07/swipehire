<!doctype html><html><head><meta charset="utf-8"><title>Div-labels application</title></head><body>
<h1>Software Developer — FixtureCo</h1>
<form id="app" action="#" method="post">
  <div class="row"><div class="label">First Name</div><input type="text" name="f1" required></div>
  <div class="row"><div class="label">Last Name</div><input type="text" name="f2" required></div>
  <div class="row"><div class="label">Email</div><input type="email" name="f3" required></div>
  <div class="row"><div class="label">Phone</div><input type="tel" name="f4" required></div>
  <div class="row"><div class="label">Resume</div><input type="file" name="f5" required></div>
  <button type="submit">Submit application</button>
</form>
<div id="done" hidden><h2>Thank you for applying. Your application has been received.</h2></div>
<script>
document.getElementById('app').addEventListener('submit', function (e) {
  e.preventDefault();
  localStorage.setItem('gauntletSubmit:labels-div', '1'); window.__submitted = true;
  e.target.hidden = true; document.getElementById('done').hidden = false;
});
</script></body></html>
