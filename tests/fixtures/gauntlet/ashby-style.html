<!doctype html><html><head><meta charset="utf-8"><title>Ashby-style application</title></head><body>
<h1>Software Developer — FixtureCo (Ashby-style)</h1>
<form id="app" action="#" method="post">
  <div class="field"><label>Full Name</label><input type="text" name="_systemfield_name" required></div>
  <div class="field"><label>Email Address</label><input type="email" name="_systemfield_email" required></div>
  <div class="field"><label>Phone Number</label><input type="tel" name="phone_number" aria-label="Phone Number" required></div>
  <div class="field"><label>Resume</label><input type="file" name="resume" required></div>
  <button type="submit">Submit application</button>
</form>
<div id="done" hidden><h2>Thank you for applying — your application has been received.</h2></div>
<script>
document.getElementById('app').addEventListener('submit', function (e) {
  e.preventDefault();
  localStorage.setItem('gauntletSubmit:ashby-style', '1'); window.__submitted = true;
  e.target.hidden = true; document.getElementById('done').hidden = false;
});
</script></body></html>
