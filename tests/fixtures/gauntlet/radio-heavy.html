<!doctype html><html><head><meta charset="utf-8"><title>Radio-heavy application</title></head><body>
<h1>Software Developer — FixtureCo</h1>
<form id="app" action="#" method="post">
  <p><label>First Name <input type="text" name="first_name" required></label></p>
  <p><label>Last Name <input type="text" name="last_name" required></label></p>
  <p><label>Email <input type="email" name="email" required></label></p>
  <fieldset>
    <legend>Are you authorized to work in Canada?</legend>
    <label><input type="radio" name="work_auth" value="Yes" required> Yes</label>
    <label><input type="radio" name="work_auth" value="No"> No</label>
  </fieldset>
  <fieldset>
    <legend>Will you now or in the future require sponsorship?</legend>
    <label><input type="radio" name="sponsorship" value="Yes" required> Yes</label>
    <label><input type="radio" name="sponsorship" value="No"> No</label>
  </fieldset>
  <p><label>Resume <input type="file" name="resume" required></label></p>
  <button type="submit">Submit application</button>
</form>
<div id="done" hidden><h2>Thank you for applying. Your application has been received.</h2></div>
<script>
document.getElementById('app').addEventListener('submit', function (e) {
  e.preventDefault();
  var d = { work_auth: (document.querySelector('input[name=work_auth]:checked') || {}).value,
            sponsorship: (document.querySelector('input[name=sponsorship]:checked') || {}).value };
  localStorage.setItem('gauntletSubmit:radio-heavy', JSON.stringify(d)); window.__submitted = d;
  e.target.hidden = true; document.getElementById('done').hidden = false;
});
</script></body></html>
