<!doctype html><html><head><meta charset="utf-8"><title>Workable-style application</title></head><body>
<h1>Software Developer — FixtureCo (Workable-style)</h1>
<form id="app" action="#" method="post">
  <p><label for="fn">First name</label><input id="fn" type="text" name="firstname" required></p>
  <p><label for="ln">Last name</label><input id="ln" type="text" name="lastname" required></p>
  <p><label for="em">Email</label><input id="em" type="email" name="email" required></p>
  <p><label for="ph">Phone</label><input id="ph" type="tel" name="phone" required></p>
  <p><label for="cv">Resume</label><input id="cv" type="file" name="resume" required></p>
  <button type="submit">Submit application</button>
</form>
<div id="done" hidden><h2>Your application has been submitted successfully.</h2></div>
<script>
document.getElementById('app').addEventListener('submit', function (e) {
  e.preventDefault();
  localStorage.setItem('gauntletSubmit:workable-style', '1'); window.__submitted = true;
  e.target.hidden = true; document.getElementById('done').hidden = false;
});
</script></body></html>
